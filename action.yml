name: GitHub Trello Sync
description: Pindahkan kartu Trello dari pesan commit dan catat progress commit ke list Done secara otomatis.
author: dasrams31
branding:
  icon: check-square
  color: blue

inputs:
  trello-key:
    description: API key Trello (simpan di secret TRELLO_KEY).
    required: true
  trello-token:
    description: Token Trello (simpan di secret TRELLO_TOKEN).
    required: true
  done-list-id:
    description: ID list tujuan untuk pekerjaan selesai (mis. Done).
    required: true
  progress-list-id:
    description: ID list untuk commit bertanda [wip] (mis. In Progress). Kosong = selalu ke done-list-id.
    required: false
    default: ''
  board-id:
    description: ID board, wajib bila memakai referensi nomor kartu seperti TR-12.
    required: false
    default: ''
  card-prefix:
    description: Awalan referensi nomor kartu di pesan commit.
    required: false
    default: TR
  authors:
    description: Filter penulis commit (nama, email, atau username GitHub), pisahkan dengan koma. Kosong = semua penulis.
    required: false
    default: ''
  create-untagged:
    description: Buat satu kartu ringkasan di done-list-id untuk commit tanpa referensi kartu.
    required: false
    default: 'true'
  categories:
    description: "Kode kategori per baris, format 'KODE: kata1, kata2'. Dipakai sebagai awalan judul kartu ringkasan."
    required: false
    default: ''
  timezone-offset:
    description: Selisih jam zona waktu untuk tanggal di kartu (WIB = 7).
    required: false
    default: '7'
  dry-run:
    description: Tampilkan rencana tanpa mengubah Trello.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Sinkron commit ke Trello
      shell: bash
      env:
        TRELLO_KEY: ${{ inputs.trello-key }}
        TRELLO_TOKEN: ${{ inputs.trello-token }}
        DONE_LIST_ID: ${{ inputs.done-list-id }}
        PROGRESS_LIST_ID: ${{ inputs.progress-list-id }}
        BOARD_ID: ${{ inputs.board-id }}
        CARD_PREFIX: ${{ inputs.card-prefix }}
        AUTHORS: ${{ inputs.authors }}
        CREATE_UNTAGGED: ${{ inputs.create-untagged }}
        CATEGORIES: ${{ inputs.categories }}
        TIMEZONE_OFFSET: ${{ inputs.timezone-offset }}
        DRY_RUN: ${{ inputs.dry-run }}
        REF_NAME: ${{ github.ref_name }}
        COMMITS_JSON: ${{ toJson(github.event.commits) }}
        HEAD_COMMIT_JSON: ${{ toJson(github.event.head_commit) }}
      run: python3 "${{ github.action_path }}/src/sync.py"
